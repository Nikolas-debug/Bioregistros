<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!--
      Sin maximum-scale ni user-scalable=no, a proposito: bloquear el zoom
      le quita al tecnico la unica forma de leer un numero de serie
      borroso en la placa de un equipo. Que pueda acercar la pantalla.
      viewport-fit=cover deja que la barra inferior llegue al borde en los
      telefonos con muesca.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Gestión Biomédica</title>
    <meta name="description" content="Registro de mantenimientos de equipos biomédicos. Funciona sin conexión y sincroniza cuando vuelve la señal." />

    <meta name="theme-color" content="#0052cc" />
    <meta name="color-scheme" content="light" />

    <!-- Instalada en iPhone: sin barra de Safari y con nombre corto. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Biomédica" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
